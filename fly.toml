# fly.toml — reconstructed from `fly config show` (deploy of Jun 2026).
app = "acervo-historia-matostf"
primary_region = "gru"

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "acervo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
