<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo de História</title>
  <script>
    // Apply saved theme before paint to avoid a flash. Default: light (mármore).
    (function () {
      var t = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7" /><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z" /><path d="M14 18v-7" /><path d="M18 18v-7" /><path d="M3 22h18" /><path d="M6 18v-7" /></svg></span>
      <div>
        <h1>Acervo de História</h1>
        <p class="tagline">Imagens em alta resolução, livres de direitos autorais, para a sala de aula</p>
      </div>
    </div>
    <nav class="topnav">
      <a href="/" class="navlink active"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg> Buscar</a>
      <a href="/library.html" class="navlink"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></svg> Minha Biblioteca <span id="libCount" class="badge">0</span></a>
      <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema"><svg class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg><svg class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg></button>
      <a href="/logout" class="navlink" title="Sair">Sair</a>
    </nav>
  </header>

  <main>
    <form id="searchForm" class="search-panel">
      <div class="search-row">
        <input
          id="query"
          type="search"
          placeholder="ex.: Império Romano, Revolução Francesa, Egito antigo…"
          autocomplete="off"
          required
        />
        <button type="submit" id="searchBtn">Buscar</button>
      </div>

      <div class="filters">
        <fieldset class="sources" id="sourceList">
          <legend>Fontes</legend>
          <!-- checkboxes injected by app.js -->
        </fieldset>

        <label class="res-filter">
          Resolução mínima
          <select id="minRes">
            <option value="0">Qualquer tamanho</option>
            <option value="1000">≥ 1000 px</option>
            <option value="2000" selected>≥ 2000 px</option>
            <option value="3000">≥ 3000 px</option>
            <option value="4000">≥ 4000 px</option>
          </select>
        </label>
      </div>
    </form>

    <section id="status" class="status" hidden></section>
    <section id="notes" class="notes" hidden></section>

    <section id="results" class="grid" aria-live="polite"></section>
  </main>

  <!-- Save dialog: choose tags + collections when saving -->
  <div id="saveModal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 id="saveModalTitle">Salvar na biblioteca</h2>
      <p class="modal-sub" id="saveModalSub"></p>

      <label class="field">
        Tags (separadas por vírgula)
        <input id="saveTags" type="text" placeholder="ex.: Roma, Império, mapa" />
      </label>

      <fieldset class="field">
        <legend>Adicionar a coleções</legend>
        <div id="saveCollections" class="checklist"></div>
        <div class="new-collection">
          <input id="newCollectionName" type="text" placeholder="Nova coleção (ex.: Aula 3 - Roma)" />
          <button type="button" id="createCollectionBtn">+ Criar</button>
        </div>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="saveCancel" class="btn ghost">Cancelar</button>
        <button type="button" id="saveConfirm" class="btn"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg> Salvar no HD</button>
      </div>
    </div>
  </div>

  <!-- Card template -->
  <template id="cardTemplate">
    <article class="card">
      <div class="thumb-wrap">
        <img class="thumb" loading="lazy" alt="" />
        <span class="source-badge"></span>
      </div>
      <div class="card-body">
        <h3 class="card-title"></h3>
        <p class="card-creator"></p>
        <p class="card-license"></p>
        <p class="card-dims"></p>
      </div>
      <div class="card-actions">
        <a class="btn download" target="_blank" rel="noopener"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg> Baixar</a>
        <a class="btn ghost view" target="_blank" rel="noopener"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg> Fonte</a>
        <button class="btn save" type="button"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg> Salvar</button>
      </div>
    </article>
  </template>

  <script src="/theme.js"></script>
  <script src="/app.js"></script>
</body>
</html>
