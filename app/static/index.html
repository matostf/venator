<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo de História</title>
  <script>
    // Apply saved theme before paint to avoid a flash. Default: light (mármore).
    (function () {
      var t = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏛️</span>
      <div>
        <h1>Acervo de História</h1>
        <p class="tagline">Imagens em alta resolução, livres de direitos autorais, para a sala de aula</p>
      </div>
    </div>
    <nav class="topnav">
      <a href="/" class="navlink active">🔎 Buscar</a>
      <a href="/library.html" class="navlink">📚 Minha Biblioteca <span id="libCount" class="badge">0</span></a>
      <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>
      <a href="/logout" class="navlink" title="Sair">Sair</a>
    </nav>
  </header>

  <main>
    <form id="searchForm" class="search-panel">
      <div class="search-row">
        <input
          id="query"
          type="search"
          placeholder="ex.: Império Romano, Revolução Francesa, Egito antigo…"
          autocomplete="off"
          required
        />
        <button type="submit" id="searchBtn">Buscar</button>
      </div>

      <div class="filters">
        <fieldset class="sources" id="sourceList">
          <legend>Fontes</legend>
          <!-- checkboxes injected by app.js -->
        </fieldset>

        <label class="res-filter">
          Resolução mínima
          <select id="minRes">
            <option value="0">Qualquer tamanho</option>
            <option value="1000">≥ 1000 px</option>
            <option value="2000" selected>≥ 2000 px</option>
            <option value="3000">≥ 3000 px</option>
            <option value="4000">≥ 4000 px</option>
          </select>
        </label>
      </div>
    </form>

    <section id="status" class="status" hidden></section>
    <section id="notes" class="notes" hidden></section>

    <section id="results" class="grid" aria-live="polite"></section>
  </main>

  <!-- Save dialog: choose tags + collections when saving -->
  <div id="saveModal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 id="saveModalTitle">Salvar na biblioteca</h2>
      <p class="modal-sub" id="saveModalSub"></p>

      <label class="field">
        Tags (separadas por vírgula)
        <input id="saveTags" type="text" placeholder="ex.: Roma, Império, mapa" />
      </label>

      <fieldset class="field">
        <legend>Adicionar a coleções</legend>
        <div id="saveCollections" class="checklist"></div>
        <div class="new-collection">
          <input id="newCollectionName" type="text" placeholder="Nova coleção (ex.: Aula 3 - Roma)" />
          <button type="button" id="createCollectionBtn">+ Criar</button>
        </div>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="saveCancel" class="btn ghost">Cancelar</button>
        <button type="button" id="saveConfirm" class="btn">⬇ Salvar no HD</button>
      </div>
    </div>
  </div>

  <!-- Card template -->
  <template id="cardTemplate">
    <article class="card">
      <div class="thumb-wrap">
        <img class="thumb" loading="lazy" alt="" />
        <span class="source-badge"></span>
      </div>
      <div class="card-body">
        <h3 class="card-title"></h3>
        <p class="card-creator"></p>
        <p class="card-license"></p>
        <p class="card-dims"></p>
      </div>
      <div class="card-actions">
        <a class="btn download" target="_blank" rel="noopener">⬇ Baixar</a>
        <a class="btn ghost view" target="_blank" rel="noopener">↗ Fonte</a>
        <button class="btn save" type="button">★ Salvar</button>
      </div>
    </article>
  </template>

  <script src="/theme.js"></script>
  <script src="/app.js"></script>
</body>
</html>
